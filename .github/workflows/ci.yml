name: Check and prepare release draft

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let a tag's asset upload finish before a second run can modify that draft.
  cancel-in-progress: false

jobs:
  verify:
    if: github.event.deleted != true
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run release:prepare
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run release:verify
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-files
          path: |
            dist/install.sh
            dist/codex-auto-router-macos.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release-draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.event.deleted != true
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: macos-release-files
          path: dist
      - name: Create draft and upload verified files
        run: node scripts/create-release-draft.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
